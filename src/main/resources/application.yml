spring:
  application:
    name: seguridad-barrial
  datasource:
    url: jdbc:postgresql://localhost:5432/seguridad_barrial
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: clave
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
